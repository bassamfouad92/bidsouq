spring:
  application:
    name: bid-service

  datasource:
    url: jdbc:postgresql://localhost:5433/bidsouq
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  threads:
    virtual:
      enabled: true

server:
  port: 8081