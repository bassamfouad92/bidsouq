services:
  postgres:
    image: postgres:16
    container_name: bidsouq-postgres
    environment:
      POSTGRES_DB: bidsouq
      POSTGRES_USER: bidsouq
      POSTGRES_PASSWORD: bidsouq
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bidsouq-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: